name: Build VicallDial (iOS)

# Mirrors the ai-ching pipeline: XcodeGen generates the project, xcodebuild
# builds unsigned for device, and the .ipa is zipped by hand. No signing, so
# install with AltStore / Sideloadly.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build VicallDial
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5

      - name: Use default Xcode
        run: xcode-select -p && xcodebuild -version

      - name: Install XcodeGen
        run: |
          curl -sL https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip -o /tmp/xcodegen.zip
          cd /tmp && unzip -q xcodegen.zip -d xcgen
          echo "/tmp/xcgen/xcodegen/bin" >> $GITHUB_PATH
          export PATH="/tmp/xcgen/xcodegen/bin:$PATH"
          xcodegen --version

      - name: Generate Xcode project
        run: |
          cd ios
          xcodegen generate --spec project.yml
          ls -la VicallDial.xcodeproj/

      # These compile fine against a modern SDK but do not exist at runtime on
      # iOS 15, so the app dies on launch with a dyld symbol failure. The
      # compiler cannot catch it because the deployment target only gates
      # APIs marked with @available, and SwiftUI modifiers resolve late.
      # Target device runs 15.6.1, so this is a hard gate.
      - name: Reject iOS 16+ API usage
        run: |
          cd ios
          BAD=0
          check() {
            if grep -rn --include='*.swift' -E "$1" VicallDial \
                 | grep -vE '^\s*[^:]+:[0-9]+:\s*//'; then
              echo "  ^^ $2"
              BAD=1
            fi
          }
          check '\.autocorrectionDisabled\(' 'iOS 16+: use .disableAutocorrection(true)'
          check '\.monospacedDigit\(\)|Font\.[a-z]+\.monospaced\(\)|\.(caption|body|footnote|headline|title)\.monospaced' \
                'iOS 16+ Font methods: use .font(.system(_:design:.monospaced))'
          check 'ShareLink|NavigationStack|ViewThatFits|\bGrid\s*\{|presentationDetents|\.scrollDisabled\(|\.toolbarBackground\(|\.scrollContentBackground\(' \
                'iOS 16+ view/API'
          check 'AVAudioApplication' 'iOS 17+: use AVCaptureDevice for mic permission'
          test "$BAD" -eq 0 || { echo "FATAL: iOS 16+ API found; target device is iOS 15.6.1"; exit 1; }
          echo "clean: no iOS 16+ APIs"

      # Release, not Debug. Xcode 16 Debug builds put the app code in a
      # separate VicallDial.debug.dylib plus __preview.dylib, which a sideloaded
      # unsigned app cannot load — the first build crashed on launch for exactly
      # this reason. Release links everything into the main binary.
      - name: Build (device, unsigned, Release)
        run: |
          cd ios
          xcodebuild \
            -project VicallDial.xcodeproj \
            -scheme VicallDial \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            clean build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_PREVIEWS=NO \
            PRODUCT_BUNDLE_IDENTIFIER=com.vicall.dial

      - name: Package .ipa
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name 'VicallDial.app' -type d -path '*/Release-iphoneos/*' | head -1)
          echo "App at: $APP_PATH"
          test -n "$APP_PATH" || { echo "build product not found"; exit 1; }

          # Guard the two faults that shipped a crashing IPA once already.
          echo "--- Info.plist checks ---"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$APP_PATH/Info.plist" \
            || { echo "FATAL: NSMicrophoneUsageDescription missing — iOS will kill the app on launch"; exit 1; }

          if ls "$APP_PATH"/*.debug.dylib >/dev/null 2>&1 || [ -f "$APP_PATH/__preview.dylib" ]; then
            echo "FATAL: debug dylibs present; a sideloaded build cannot load them"
            ls -la "$APP_PATH"
            exit 1
          fi

          # The real binary must carry the code, not a stub next to a dylib.
          BIN_SIZE=$(stat -f%z "$APP_PATH/VicallDial")
          echo "main binary: $BIN_SIZE bytes"
          [ "$BIN_SIZE" -gt 200000 ] || { echo "FATAL: binary too small — code likely still in a dylib"; exit 1; }

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr VicallDial.ipa Payload/
          ls -la VicallDial.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: VicallDial-ipa
          path: VicallDial.ipa
          retention-days: 14
