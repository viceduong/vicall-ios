name: VicallDial
options:
  bundleIdPrefix: com.vicall
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: false
  generateEmptyDirectories: false
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic

targets:
  VicallDial:
    type: application
    platform: iOS
    sources:
      # Info.plist is generated from the `info` block below, so exclude the
      # checked-in copy or it ends up as a bundle resource and shadows it.
      - path: VicallDial
        excludes:
          - Info.plist
    # XcodeGen GENERATES the plist at `info.path`, overwriting whatever is
    # there. Declaring the keys here is therefore the only way they survive —
    # a hand-written Info.plist plus INFOPLIST_FILE silently loses them.
    # Getting this wrong crashed the first build on launch: iOS terminates any
    # app that touches the microphone with no NSMicrophoneUsageDescription.
    info:
      path: VicallDial/Info.generated.plist
      properties:
        CFBundleDisplayName: Vicall
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Mandatory: the app records audio. Without it iOS kills the process.
        NSMicrophoneUsageDescription: >-
          Vicall uses the microphone to place test calls to your
          call-screening server.
        # Keep the socket and audio alive when the screen locks mid-call.
        UIBackgroundModes:
          - audio
        # Allows plain ws:// to a LAN dev server; the tunnel uses wss://.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vicall.dial
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    dependencies: []
